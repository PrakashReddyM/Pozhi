# ==========================================
# PRODUCTION DOCKER COMPOSE
#
# Before starting:
#   1. Copy backend/.env.production.example → backend/.env.production and fill in values
#   2. Replace every "yourdomain.com" in nginx/nginx.conf with your real domain
#   3. Run ./deploy.sh on the server (once) to get SSL certs and start everything
#
# Day-to-day:
#   docker compose -f docker-compose.prod.yml up -d       start / update
#   docker compose -f docker-compose.prod.yml down        stop
#   docker compose -f docker-compose.prod.yml logs -f     tail logs
# ==========================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pozhi-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pozhi
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pozhi-redis-prod
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pozhi-backend-prod
    restart: always
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: pozhi-frontend-prod
    restart: always
    depends_on:
      - backend

  admin-frontend:
    build:
      context: ./admin/frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: pozhi-admin-prod
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: pozhi-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - admin-frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: pozhi-certbot-prod
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  redisdata:
